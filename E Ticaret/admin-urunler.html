<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Yönetimi | Yönetici Paneli</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="left-nav">
                <div class="logo"><a href="index.html">Ürün Yönetimi</a></div>
            </div>
            <div class="admin-filters">
                <input type="text" id="admin-product-search" placeholder="Kendi ürünlerinizde arayın...">
            </div>
            <div class="nav-icons">
                <button id="open-add-product-modal-btn" class="btn navbar-add-product-btn">Yeni Ürün Ekle</button>
                <div class="menu-container">
                    <button id="menu-toggle" class="menu-button">
                        <i class="fas fa-user"></i>
                    </button>
                    <div id="dropdown-menu" class="dropdown-menu hidden">
                        <a href="admin.html" id="dropdown-profile-link">Yönetici Paneli</a>
                        <a href="admin-urunler.html">Ürünleri Yönet</a>
                        <a href="admin-siparisler.html">Siparişleri Yönet</a>
                        <a href="#" id="dropdown-logout-link">Çıkış Yap</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    

        <div class="admin-section" id="admin-products-content">
            <!-- Kategoriler kaldırıldı; arama artık navbar'da yer alıyor -->
            <div id="admin-product-list" class="admin-table-container">
                <!-- Ürünler buraya dinamik olarak eklenecek -->
            </div>
        </div>

        <!-- Ürün Ekle/Düzenle Modalı -->
        <div id="product-modal-overlay" class="modal-overlay hidden">
            <div class="modal-content">
                <button class="modal-close-btn">&times;</button>
                <h2 id="product-modal-title"></h2>
                <form id="product-form" class="admin-form">
                    <input type="hidden" id="product-id-to-edit">
                    <div class="input-group">
                        <label for="product-name">Ürün Adı</label>
                        <input type="text" id="product-name" placeholder="Ürün Adı" required>
                    </div>
                    <div class="input-group">
                        <label for="product-price">Fiyat (₺)</label>
                        <input type="number" id="product-price" placeholder="Fiyat (₺)" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label for="product-stock">Stok Adedi</label>
                        <input type="number" id="product-stock" placeholder="Stok Adedi" min="0" required>
                    </div>
                    <div class="input-group">
                        <label for="product-category">Kategori</label>
                        <input type="text" id="product-category" placeholder="Kategori" required>
                    </div>
                    <div class="input-group">
                        <label for="product-brand">Marka</label>
                        <input type="text" id="product-brand" placeholder="Marka" required>
                    </div>
                    <div class="input-group">
                        <label for="product-image">Resim URL</label>
                        <input type="text" id="product-image" placeholder="Resim URL" required>
                    </div>
                    <button type="submit" class="btn">Kaydet</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
