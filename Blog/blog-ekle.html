<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Blog Ekle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">Blog Sitem</a></h1>
            <nav>
                <a href="index.html">Ana Sayfa</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h2>Yeni Blog Yazısı Ekle</h2>
            <form id="add-blog-form">
                <div class="form-grup">
                    <label for="blog-title">Blog Başlığı</label>
                    <input type="text" id="blog-title" name="blog-title" required>
                </div>
                <div class="form-grup">
                    <label for="blog-topic">Blog Konusu (Kısa Açıklama)</label>
                    <input type="text" id="blog-topic" name="blog-topic" required>
                </div>
                <div class="form-grup">
                    <label for="blog-author">Yazar Adı</label>
                    <input type="text" id="blog-author" name="blog-author" required>
                </div>
                <div class="form-grup">
                    <label for="blog-content">Blog İçeriği</label>
                    <textarea id="blog-content" name="blog-content" rows="10" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Yayınla</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Blog Sitem. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
