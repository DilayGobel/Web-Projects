<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çalışma Defterim - Ana Sayfa</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Iconları için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">Çalışma Defterim</a></h1>
            <nav>
                <a href="sayac.html">Sayaç</a>
                <a href="gorev-ekle.html">Görev Ekle</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="summary-box">
                <h2>Toplam <span id="total-work-time">0</span> dakika çalıştın.</h2>
            </div>

            <div class="list-controls">
                <h2>Yapılacaklar Listesi</h2>
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">Tümü</button>
                    <button class="filter-btn" data-filter="active">Aktif</button>
                    <button class="filter-btn" data-filter="completed">Tamamlanmış</button>
                </div>
            </div>

            <div class="task-list-container">
                <ul id="task-list">
                    <!-- Görevler buraya JS ile eklenecek -->
                </ul>
                <p id="no-tasks-message">Henüz görev eklenmemiş. İlk görevinizi ekleyin!</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Çalışma Defterim</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
